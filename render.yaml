services:
  - type: web
    name: 90s-hindi-radio
    env: static
    staticPublishPath: .
    buildCommand: echo "Static site - no build needed"
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
